name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - run: dotnet restore XpZ12013.Sdk.slnx

      - run: dotnet build XpZ12013.Sdk.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/XpZ12013.Sdk.Tests/XpZ12013.Sdk.Tests.csproj -c Release --no-build --verbosity normal

      - name: Pack
        run: |
          dotnet pack dotnet/XpZ12013.Sdk/XpZ12013.Sdk.csproj -c Release --no-build -o artifacts
          dotnet pack dotnet/XpZ12013.Sdk.DependencyInjection/XpZ12013.Sdk.DependencyInjection.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  integration:
    name: Sandbox integration tests
    runs-on: ubuntu-latest
    needs: build-test
    # Runs on pushes to main only (secrets are not exposed to fork PRs).
    if: github.event_name == 'push'
    environment: sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Integration tests (sandbox)
        run: dotnet test tests/XpZ12013.Sdk.IntegrationTests/XpZ12013.Sdk.IntegrationTests.csproj -c Release --verbosity normal
        env:
          XPZ_FLOW_URL: ${{ secrets.XPZ_FLOW_URL }}
          XPZ_DIRECTORY_URL: ${{ secrets.XPZ_DIRECTORY_URL }}
          XPZ_CLIENT_ID: ${{ secrets.XPZ_CLIENT_ID }}
          XPZ_CLIENT_SECRET: ${{ secrets.XPZ_CLIENT_SECRET }}
          XPZ_TOKEN_URL: ${{ secrets.XPZ_TOKEN_URL }}
