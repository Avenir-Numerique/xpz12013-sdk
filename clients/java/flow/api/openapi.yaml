openapi: 3.0.3
info:
  contact:
    email: sg5@afnor.org
    name: AFNOR
  description: "The __Flow Service API__ allows to:\n  - Upload a flow.\n  - Retrieve\
    \ information related to a set of flows.\n  - Download a flow given its identifier\n\
    \nThe resources of the API are :\n  - `/flows` : with creation and retrieval methods.\n\
    \  - `/webhooks` : creation, update, delete, list\n\nWorflow example:\n  - `POST\
    \ /flows` : provide the flow information & content\n  - `POST /flows/search` :\
    \ retrieve flows given multiple criterias.\n  - `GET /flows/{id}` : download a\
    \ flow based on its id.\n  - `POST /webhooks` : subscribe to a channel of event\n\
    \ \nHistory:\n  - `1.0.0` : First release\n  - `1.0.1` : Fixes following 2025/04/15\
    \ SG5 plenary meeting\n    - Remove AcknowledgementXXX enumerates from FlowType\n\
    \    - Acknowledgement is now based upon details (level, item, reason)\n    -\
    \ Add the attachment number in the flow information\n    - Add query parameters\
    \ docType & docIndex to aim a specific download\n    - Change pagination method,\
    \ from cursors to offsets\n  - `1.0.2` : Fixes following 2025/05/06 SG5 plenary\
    \ meeting\n    - FlowId & TrackingId as not only UUID for more flexibility\n \
    \   - Add sha256 fingerprint to allow integrity check\n    - Add trackingId as\
    \ a filter criteria and in the Flow object\n    - Add full FlowInfo object + submission\
    \ date in POST response\n    - Add comments\n  - `1.1.0` : Fixes following 2025/05/20\
    \ SG5 meeting\n    - Get operation: allows also to return the flow data when docType\
    \ is set to Metadata\n    - Search operation: flowId is no longer a criteria,\
    \ prefer too use the Get by Id operation\n    - Remove any reference to any attached\
    \ document to the flow\n    - Refactor FullFlowInfo schema\n    - FlowType update\
    \ (FRR 10.*) for reporting\n    - AcknowledgementDetail update to add a message\
    \ and a code\n    - offset removal, do pagination using updatedAfter\n    - remove\
    \ 206 status code\n    - Add StateInvoice & associated LC in FlowType enum\n \
    \   - Add extensible reason codes related to Life cycle errors\n    - Add ProcessingRule\
    \ to the flow object & criteria\n    - Add webhooks callback contents\n  - `1.2.0`\
    \ : \n    - Webhook management, create, update, list, delete, get\n    - Add new\
    \ flow types: B2G, B2GInt, B2GOutOfScope\n    - Add new client credentials OAuth2\
    \ workflow\n    - Optimized FlowInfo/FullFlowInfo/Flow schemas\n    - Add name\
    \ in Flow schema\n    - Add OAuth2 securityScheme\n    - Add Header parameter\
    \ Organization-Id to ease delegation\n"
  title: AFNOR Flow Service
  version: 1.2.0
servers:
- description: Prod public URLs
  url: "https://{sub-domain}.{domain}/flow-service"
  variables:
    sub-domain:
      default: api.flow
      description: Sub domain related to the Flow API if any
    domain:
      default: company.com
      description: Domain name
security:
- BearerAuth: []
- OAuth2: []
tags:
- description: Flow management
  name: Flow
- description: Service supervision
  name: Supervisor
- description: Webhook management
  name: Webhook
paths:
  /v1/flows:
    post:
      description: "Submit a flow. A flow is a single-invoice file, with :\n  - an\
        \ XML/PDF file with the data of the invoice\n\nThe flow is created with a\
        \ `flowInfo` object, allowing to qualify the flow.\n  \nA flow can be :\n\
        \  - an invoice (CII, UBL, Factur-X,...) \n  - a lifecycle (CDAR) \n  - or\
        \ a e-reporting file\n"
      operationId: createFlow
      parameters:
      - description: Header parameter used to correlate logs from several components
        explode: false
        in: header
        name: Request-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: The organization that is aimed in a multi tenancy context
        explode: false
        in: header
        name: Organization-Id
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        $ref: '#/components/requestBodies/FlowPostRequest'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullFlowInfo'
          description: |
            OK - Response message once the flow has been uploaded.
        "400":
          content:
            application/json:
              example:
                errorCode: MISSING_REQUIRED_FIELD
                errorMessage: Invalid request format
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 400 : Bad request."
        "401":
          content:
            application/json:
              example:
                errorCode: MISSING_TOKEN
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 401 : Authentication error."
        "403":
          content:
            application/json:
              example:
                errorCode: FORBIDDEN_ACCESS
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 403 : Forbidden."
        "413":
          content:
            application/json:
              example:
                errorCode: FILE_SIZE_EXCEEDED
                errorMessage: Provided file is too big
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 413 : Payload Too Large."
        "422":
          content:
            application/json:
              example:
                errorCode: UNPROCESSABLE_ENTITY
                errorMessage: Entity consistency error
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 422 : Unprocessable entity."
        "429":
          content:
            application/json:
              example:
                errorCode: TOO_MANY_REQUESTS
                errorMessage: The client emitted too many requests
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 429 : Too many requests."
        "500":
          content:
            application/json:
              example:
                errorCode: INTERNAL_ERROR
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 500 : Server Internal Error."
        "503":
          content:
            application/json:
              example:
                errorCode: RESOURCE_ERROR
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 503 : Unavailable Resource."
      summary: Submit a new flow
      tags:
      - Flow
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /v1/flows/search:
    post:
      description: |
        Retrieves a set of flows matching the provided search criteria:
          - Need at least one criterion to be specified
          - Assuming a logical AND when combining criteria
          - Assuming a logical OR for criteria allowing a list of values

        Pagination works with the updatedAfter property
        The comparison with current date is strict : updatedAt > updatedAfter
      operationId: searchFlows
      parameters:
      - description: Header parameter used to correlate logs from several components
        explode: false
        in: header
        name: Request-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: The organization that is aimed in a multi tenancy context
        explode: false
        in: header
        name: Organization-Id
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        $ref: '#/components/requestBodies/FlowSearchRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFlowContent'
          description: |
            OK - Response message when returning the results of a search request.
        "400":
          content:
            application/json:
              example:
                errorCode: MISSING_REQUIRED_FIELD
                errorMessage: Invalid request format
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 400 : Bad request."
        "401":
          content:
            application/json:
              example:
                errorCode: MISSING_TOKEN
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 401 : Authentication error."
        "403":
          content:
            application/json:
              example:
                errorCode: FORBIDDEN_ACCESS
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 403 : Forbidden."
        "429":
          content:
            application/json:
              example:
                errorCode: TOO_MANY_REQUESTS
                errorMessage: The client emitted too many requests
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 429 : Too many requests."
        "500":
          content:
            application/json:
              example:
                errorCode: INTERNAL_ERROR
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 500 : Server Internal Error."
        "503":
          content:
            application/json:
              example:
                errorCode: RESOURCE_ERROR
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 503 : Unavailable Resource."
