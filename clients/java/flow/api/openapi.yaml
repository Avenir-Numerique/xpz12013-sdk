          parameters:
          - description: |
              The signature field is required whenever the callback properties hold a signature block
              - what content is considered into the signature ? body, headers, timestamp
              - how is the signed content serialized ? Do we need a canonical form ?
            explode: false
            in: header
            name: Signature
            required: false
            schema:
              description: Base 64 encoded string
              format: byte
              type: string
            style: simple
          requestBody:
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Flow'
            required: true
          responses:
            "200":
              description: OK - Operation succeeded
            "400":
              content:
                application/json:
                  example:
                    errorCode: MISSING_REQUIRED_FIELD
                    errorMessage: Invalid request format
                  schema:
                    $ref: '#/components/schemas/Error'
              description: "Error 400 : Bad request."
            "401":
              content:
                application/json:
                  example:
                    errorCode: MISSING_TOKEN
                    errorMessage: null
                  schema:
                    $ref: '#/components/schemas/Error'
              description: "Error 401 : Authentication error."
            "403":
              content:
                application/json:
                  example:
                    errorCode: FORBIDDEN_ACCESS
                    errorMessage: null
                  schema:
                    $ref: '#/components/schemas/Error'
              description: "Error 403 : Forbidden."
            "500":
              content:
                application/json:
                  example:
                    errorCode: INTERNAL_ERROR
                    errorMessage: null
                  schema:
                    $ref: '#/components/schemas/Error'
              description: "Error 500 : Server Internal Error."
  parameters:
    webhookUidPathParam:
      description: The webhook unique ID
      explode: false
      in: path
      name: webhookUid
      required: true
      schema:
        $ref: '#/components/schemas/WebhookId'
      style: simple
    organizationIdHeaderParam:
      description: The organization that is aimed in a multi tenancy context
      explode: false
      in: header
      name: Organization-Id
      required: false
      schema:
        type: string
      style: simple
    RequestIdHeader:
      description: Header parameter used to correlate logs from several components
      explode: false
      in: header
      name: Request-Id
      required: false
      schema:
        format: uuid
        type: string
      style: simple
  requestBodies:
    FlowSearchRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFlowParams'
    FlowPostRequest:
      content:
        multipart/form-data:
          encoding:
            file:
              contentType: "application/pdf, application/xml"
              style: form
            flowInfo:
              contentType: application/json
              style: form
          schema:
            $ref: '#/components/schemas/createFlow_request'
    WebhookPostRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookParams'
      description: Create a webhook
    WebhookPatchRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookPatchPayload'
      description: Update a webhook's technical parameters
  responses:
    FlowSearchResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchFlowContent'
      description: |
        OK - Response message when returning the results of a search request.
    FlowPostResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FullFlowInfo'
      description: |
        OK - Response message once the flow has been uploaded.
    FlowGetResponse:
      content:
        application/octet-stream: {}
        application/json:
          schema:
            $ref: '#/components/schemas/Flow'
      description: OK - Response message once the flow has been downloaded.
      headers:
        Content-Disposition:
          description: Header specifying attached file name
          explode: false
          schema:
            pattern: attachment;filename=*
            type: string
          style: simple
    WebhookLightResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WebhookIdParam'
      description: OK - Webhook Created
    WebhookFullResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Webhook'
      description: OK - Webhook Retrieved
    WebhookListResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/listWebhooks_200_response'
      description: OK - Webhook Id List Response
    Error400Response:
      content:
        application/json:
          example:
            errorCode: MISSING_REQUIRED_FIELD
            errorMessage: Invalid request format
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 400 : Bad request."
    Error401Response:
      content:
        application/json:
          example:
            errorCode: MISSING_TOKEN
            errorMessage: null
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 401 : Authentication error."
    Error403Response:
      content:
        application/json:
          example:
            errorCode: FORBIDDEN_ACCESS
            errorMessage: null
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 403 : Forbidden."
    Error413Response:
      content:
        application/json:
          example:
            errorCode: FILE_SIZE_EXCEEDED
            errorMessage: Provided file is too big
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 413 : Payload Too Large."
    Error422Response:
      content:
        application/json:
          example:
            errorCode: UNPROCESSABLE_ENTITY
            errorMessage: Entity consistency error
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 422 : Unprocessable entity."
    Error429Response:
      content:
        application/json:
          example:
            errorCode: TOO_MANY_REQUESTS
            errorMessage: The client emitted too many requests
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 429 : Too many requests."
    Error500Response:
      content:
        application/json:
          example:
            errorCode: INTERNAL_ERROR
            errorMessage: null
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 500 : Server Internal Error."
    Error503Response:
      content:
        application/json:
          example:
            errorCode: RESOURCE_ERROR
            errorMessage: null
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 503 : Unavailable Resource."
    Error404Response:
      content:
        application/json:
          example:
            errorCode: MISSING_RESOURCE
            errorMessage: Requested resource is Not Found
          schema:
            $ref: '#/components/schemas/Error'
      description: "Error 404 : Resource Not Found."
    Ok204EmptyResponse:
      description: No Content - No content expected
    Ok200EmptyResponse:
      description: OK - Operation succeeded
  schemas:
    NotOnlyUuid:
      description: "Unique identifier supporting UUID but not only, for flexibility\
        \ purpose"
      maxLength: 36
      type: string
    ProcessingRule:
      description: |
        - B2B                 : e-invoicing
        - B2BInt              : International B2B e-reporting
        - B2C                 : B2C e-reporting
        - B2G                 : e-invoicing for B2G sales
        - B2GInt
        - OutOfScope          : Out of scope (not regulated flow)
        - B2GOutOfScope
        - ArchiveOnly         : Archive only, no transmission
        - NotApplicable       : Not Applicable
      enum:
      - B2B
      - B2BInt
      - B2C
      - B2G
      - B2GInt
      - OutOfScope
      - B2GOutOfScope
      - ArchiveOnly
      - NotApplicable
      type: string
    FlowSyntax:
      description: Syntax of the original file belonging to a flow
      enum:
      - CII
      - UBL
      - Factur-X
      - CDAR
      - FRR
      example: CII
      type: string
    FlowProfile:
      enum:
      - Basic
      - CIUS
      - Extended-CTC-FR
      type: string
    FlowType:
      description: |
        - `CustomerInvoice`: a non-self-billed outgoing invoice or a self-billed incoming invoice
        - `SupplierInvoice`: a non-self-billed incoming invoice or self-billed outgoing invoice
        - `StateInvoice`: an invoice Flow sent to DFH
        - `CustomerInvoiceLC`: a lifecycle (CDAR) related to a customer invoice
        - `SupplierInvoiceLC`: a lifecycle (CDAR) related to supplier invoice
        - `StateCustomerInvoiceLC`: a customer invoice LC sent to DFH
        - `StateSupplierInvoiceLC`: a supplier invoice LC sent to DFH
        - `AggregatedCustomerTransactionReport` : a transaction E-Reporting flow containing aggregated B2C sales (FRR 10.3)
        - `IndividualCustomerTransactionReport`: a transaction E-Reporting flow containing international B2B sales or a B2C transaction flow reported individually (FRR 10.1)
        - `AggregatedCustomerPaymentReport` : a E-Reporting of collections flow containing collections linked to B2C sales (FRR 10.4)
        - `UnitaryCustomerPaymentReport` : an E-Reporting of collections flow containing collections linked to unit international B2B sales or B2C sales (FRR 10.2)
        - `UnitarySupplierTransactionReport`: a transaction E-Reporting flow containing international B2B purchases (FRR 10.1)
        - `MultiFlowReport`: an E-Reporting flow which contains at least 2 different flow types (FRR 10)
      enum:
      - CustomerInvoice
      - SupplierInvoice
      - StateInvoice
      - CustomerInvoiceLC
      - SupplierInvoiceLC
      - StateCustomerInvoiceLC
      - StateSupplierInvoiceLC
      - AggregatedCustomerTransactionReport
      - UnitaryCustomerTransactionReport
      - AggregatedCustomerPaymentReport
      - UnitaryCustomerPaymentReport
      - UnitarySupplierTransactionReport
      - MultiFlowReport
      example: SupplierInvoice
      type: string
    FlowDirection:
      description: |
        Direction of the flow:
          - `In`:  Incoming flow, from the PDP to the OD
          - `Out`: Outgoing flow, from the OD to the PDP
      enum:
      - In
      - Out
      example: Out
      type: string
    FlowAckStatus:
      description: |
        - `Ok`: the following checks have passed:
          - Anti virus
          - Integrity checks
          - Technical rules checks
          - Unicity checks
        - `Error`: one of the previous test has failed
        - `Pending` : the flow is not yet integrated
      enum:
      - Pending
      - Ok
      - Error
      type: string
    ReasonCode:
      description: A predefined set of reason code values + ability to extend this
        set
      oneOf:
      - $ref: '#/components/schemas/ReasonCodeEnum'
      - type: string
    ReasonCodeEnum:
      description: |
        - `EmptyAttachement`      : One or more attachments are empty. (ie IRR_VID_PJ)
        - `AttachmentTypeError`   : The type and/or extension of one or more attachments is not compliant. (ie IRR_EXT_DOC)
        - `EmptyFlow`             : The binary flow is empty. (ie IRR_VID_F)
        - `OtherTechnicalError`   : Other technical error. (ie AUTRE)
        - `InvalidSchema`         : Invalid XML schema. (ie IRR_SYNTAX)
        - `FileSizeExceeded`      : File size limit reached. (ie IRR_TAILLE_F)
        - `FlowTypeError`         : The flow type and/or extension are not compliant. (ie IRR_TYPE_F)
        - `AlreadyExistingFlow`   : The flow has already been sent and received. (ie N/A)
        - `VirusFound`            : Presence of a virus. (ie IRR_ANTIVIRUS)
        - `ChecksumMismatch`      : Checksum provided is different from computed one
        - `InvoiceLCInvalidStatus`: One or more statuses are inconsistent
        - `InvoiceLCStatusError`  : One or more statuses are incorrect or not allowed
        - `InvoiceLCRuleError`    : One or more rules are not matched
        - `InvoiceLCAccessDenied` : One of the request is not authorized and requests permissions
        - `InvoiceLCAmountError`  : One or more amounts are not consistent in regards to the VAT
      enum:
      - EmptyAttachement
      - AttachmentTypeError
      - EmptyFlow
      - OtherTechnicalError
      - InvalidSchema
      - FileSizeExceeded
      - FlowTypeError
      - AlreadyExistingFlow
      - VirusFound
      - ChecksumMismatch
      - InvoiceLCInvalidStatus
      - InvoiceLCStatusError
      - InvoiceLCRuleError
      - InvoiceLCAccessDenied
      - InvoiceLCAmountError
      type: string
    Algorithm:
      enum:
      - RS256
      - HS256
      - ECDSA
      - EDDSA_25519
      - RSA_PSS
      - EDDSA_448
      - null
      type: string
    CoreFlowInfo:
      description: "Core schema to build FlowInfo, FullFlowInfo, Flow schemas"
      properties:
        trackingId:
          allOf:
          - $ref: '#/components/schemas/NotOnlyUuid'
          description: The tracking id is an external identifier and is used to track
            the flow by the sender
        name:
          description: Name of the file
          maxLength: 255
          type: string
        processingRule:
          $ref: '#/components/schemas/ProcessingRule'
        flowSyntax:
          $ref: '#/components/schemas/FlowSyntax'
        flowProfile:
          $ref: '#/components/schemas/FlowProfile'
      required:
      - flowSyntax
      - name
      type: object
    FlowInfoExtension:
      description: Extension to build the FlowInfo
      properties:
        sha256:
          description: |
            The sha256 is the fingerprint of the attached file:
            - if provided in the request: it should be checked once received
            - if not provided in the request: it may be computed and returned in the response
          format: byte
          pattern: "^[a-f0-9]{64}$"
          type: string
      type: object
    FlowInfo:
      allOf:
      - $ref: '#/components/schemas/CoreFlowInfo'
      - $ref: '#/components/schemas/FlowInfoExtension'
      description: Signaling of the flow
    SearchFlowParams:
      example:
        limit: 8
        where:
          updatedBefore: 2000-01-23T04:56:07.000+00:00
          updatedAfter: 2000-01-23T04:56:07.000+00:00
          processingRule:
          - B2B
          - B2B
          flowDirection:
          - Out
          - Out
          ackStatus: Pending
          flowType:
          - SupplierInvoice
          - SupplierInvoice
          trackingId: trackingId
      properties:
        limit:
          default: 25
          description: Maximum number of results that may be returned
          maximum: 100
          type: integer
        where:
          $ref: '#/components/schemas/SearchFlowFilters'
      required:
      - where
      type: object
    SearchFlowFilters:
      description: "Filtering criteria, at least one is required"
      example:
        updatedBefore: 2000-01-23T04:56:07.000+00:00
        updatedAfter: 2000-01-23T04:56:07.000+00:00
        processingRule:
        - B2B
        - B2B
        flowDirection:
        - Out
        - Out
        ackStatus: Pending
        flowType:
        - SupplierInvoice
        - SupplierInvoice
        trackingId: trackingId
      properties:
        updatedAfter:
          description: "The comparison with current date is strict : updatedAt > updatedAfter"
          format: date-time
          type: string
        updatedBefore:
          format: date-time
          type: string
        processingRule:
          items:
            $ref: '#/components/schemas/ProcessingRule'
          type: array
        flowType:
          items:
            $ref: '#/components/schemas/FlowType'
          type: array
        flowDirection:
          items:
            $ref: '#/components/schemas/FlowDirection'
          type: array
        trackingId:
          description: "Unique identifier supporting UUID but not only, for flexibility\
            \ purpose"
          maxLength: 36
          type: string
        ackStatus:
          $ref: '#/components/schemas/FlowAckStatus'
      type: object
    FullFlowInfoExtension:
      description: "Extension schema to build FFullFlowInfo, Flow schemas"
      properties:
        flowId:
          description: "Unique identifier supporting UUID but not only, for flexibility\
            \ purpose"
          maxLength: 36
          type: string
        submittedAt:
          description: |
            The flow submission date and time (the date and time when the flow was created on the system)
            This property should be used by the API consumer as a time reference to avoid clock synchronization issues
          format: date-time
          type: string
      required:
      - flowId
      - submittedAt
      type: object
    FullFlowInfo:
      allOf:
      - $ref: '#/components/schemas/FullFlowInfoExtension'
      - $ref: '#/components/schemas/FlowInfo'
      description: "Identified Flow info: flow info + id + timestamp"
      example:
        flowProfile: Basic
        processingRule: B2B
        sha256: sha256
        name: name
        flowSyntax: CII
        submittedAt: 2000-01-23T04:56:07.000+00:00
        flowId: flowId
        trackingId: ""
    AcknowledgementDetail:
      example:
        item: item
        level: Error
        reasonMessage: reasonMessage
        reasonCode: EmptyAttachement
      properties:
        level:
          enum:
          - Error
          - Warning
          type: string
        item:
          description: Item on which the error refers
          type: string
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        reasonMessage:
          type: string
      required:
      - item
      - level
      - reasonCode
      - reasonMessage
      type: object
    AcknowledgementDetails:
      items:
        $ref: '#/components/schemas/AcknowledgementDetail'
      minItems: 1
      type: array
    Acknowledgement:
      example:
        details:
        - item: item
          level: Error
          reasonMessage: reasonMessage
          reasonCode: EmptyAttachement
        - item: item
          level: Error
          reasonMessage: reasonMessage
          reasonCode: EmptyAttachement
        status: null
      properties:
        status:
          $ref: '#/components/schemas/FlowAckStatus'
        details:
          items:
            $ref: '#/components/schemas/AcknowledgementDetail'
          minItems: 1
          type: array
      required:
      - status
      type: object
    FlowExtension:
      description: Extension schema to build Flow schema
      properties:
        updatedAt:
          description: |
            The last update date and time of the flow. When the flow is submitted updatedAt is equal to submittedAt.
            When the flow acknowledgment status is changed updatedAt date and time is updated.
          format: date-time
          type: string
        flowType:
          $ref: '#/components/schemas/FlowType'
        processingRuleSource:
          description: Says whether the processing rule has been computed or the processing
            rule was an input parameter
          enum:
          - Input
          - Computed
          type: string
        flowDirection:
          $ref: '#/components/schemas/FlowDirection'
        acknowledgement:
          $ref: '#/components/schemas/Acknowledgement'
      required:
      - acknowledgement
      - flowDirection
      - flowType
      - processingRuleSource
      - updatedAt
      type: object
    Flow:
      allOf:
      - $ref: '#/components/schemas/CoreFlowInfo'
      - $ref: '#/components/schemas/FullFlowInfoExtension'
      - $ref: '#/components/schemas/FlowExtension'
      description: The properties of a Flow resource
      example:
        flowProfile: Basic
        processingRuleSource: Input
        processingRule: null
        acknowledgement:
          details:
          - item: item
            level: Error
            reasonMessage: reasonMessage
            reasonCode: EmptyAttachement
          - item: item
            level: Error
            reasonMessage: reasonMessage
            reasonCode: EmptyAttachement
          status: null
        flowDirection: Out
        name: name
        flowSyntax: CII
        submittedAt: 2000-01-23T04:56:07.000+00:00
        flowId: flowId
        trackingId: ""
        updatedAt: 2000-01-23T04:56:07.000+00:00
        flowType: SupplierInvoice
    SearchFlowContent:
      description: "A set of flows matching criterias, provided into the request"
      example:
        limit: 0
        filters:
          updatedBefore: 2000-01-23T04:56:07.000+00:00
          updatedAfter: 2000-01-23T04:56:07.000+00:00
          processingRule:
          - B2B
          - B2B
          flowDirection:
          - Out
          - Out
          ackStatus: Pending
          flowType:
          - SupplierInvoice
          - SupplierInvoice
          trackingId: trackingId
        results:
        - flowProfile: Basic
          processingRuleSource: Input
          processingRule: null
          acknowledgement:
            details:
            - item: item
              level: Error
              reasonMessage: reasonMessage
              reasonCode: EmptyAttachement
            - item: item
              level: Error
              reasonMessage: reasonMessage
              reasonCode: EmptyAttachement
            status: null
          flowDirection: Out
          name: name
          flowSyntax: CII
          submittedAt: 2000-01-23T04:56:07.000+00:00
          flowId: flowId
          trackingId: ""
          updatedAt: 2000-01-23T04:56:07.000+00:00
          flowType: SupplierInvoice
        - flowProfile: Basic
          processingRuleSource: Input
          processingRule: null
          acknowledgement:
            details:
            - item: item
              level: Error
              reasonMessage: reasonMessage
              reasonCode: EmptyAttachement
            - item: item
              level: Error
              reasonMessage: reasonMessage
              reasonCode: EmptyAttachement
            status: null
          flowDirection: Out
          name: name
          flowSyntax: CII
          submittedAt: 2000-01-23T04:56:07.000+00:00
          flowId: flowId
          trackingId: ""
          updatedAt: 2000-01-23T04:56:07.000+00:00
          flowType: SupplierInvoice
      properties:
        limit:
          type: integer
        filters:
          $ref: '#/components/schemas/SearchFlowFilters'
        results:
          items:
            $ref: '#/components/schemas/Flow'
          type: array
