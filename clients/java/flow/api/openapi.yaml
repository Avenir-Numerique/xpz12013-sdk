  /v1/flows/{flowId}:
    get:
      description: |
        Download a file related to a given flow:
          - an invoice
          - a life cycle
          - an e-reporting
      operationId: getFlow
      parameters:
      - description: Header parameter used to correlate logs from several components
        explode: false
        in: header
        name: Request-Id
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - description: The organization that is aimed in a multi tenancy context
        explode: false
        in: header
        name: Organization-Id
        required: false
        schema:
          type: string
        style: simple
      - description: Flow identifier
        explode: false
        in: path
        name: flowId
        required: true
        schema:
          $ref: '#/components/schemas/NotOnlyUuid'
        style: simple
      - description: |
          This parameter allows to provide the type of file to be downloaded, can be either one:
            - Metadata [Default]: provides the flow metadata as a JSON payload, no download
            - Original: the document that has been initially sent/provided by the emitter
            - Converted: the document that has been optionally converted by the system
            - ReadableView: the document that has been optionally generated as the readable file
        explode: true
        in: query
        name: docType
        required: false
        schema:
          default: Metadata
          enum:
          - Metadata
          - Original
          - Converted
          - ReadableView
          type: string
        style: form
      responses:
        "200":
          content:
            application/octet-stream: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
          description: OK - Response message once the flow has been downloaded.
          headers:
            Content-Disposition:
              description: Header specifying attached file name
              explode: false
              schema:
                pattern: attachment;filename=*
                type: string
              style: simple
        "400":
          content:
            application/json:
              example:
                errorCode: MISSING_REQUIRED_FIELD
                errorMessage: Invalid request format
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 400 : Bad request."
        "401":
          content:
            application/json:
              example:
                errorCode: MISSING_TOKEN
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 401 : Authentication error."
        "403":
          content:
            application/json:
              example:
                errorCode: FORBIDDEN_ACCESS
                errorMessage: null
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 403 : Forbidden."
        "404":
          content:
            application/json:
              example:
                errorCode: MISSING_RESOURCE
                errorMessage: Requested resource is Not Found
              schema:
                $ref: '#/components/schemas/Error'
          description: "Error 404 : Resource Not Found."
